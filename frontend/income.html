<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ExpenseIQ – Income</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">💰 Expense<span>IQ</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="expenses.html">💸 Expenses</a>
      <a href="income.html">💵 Income</a>
      <a href="budget.html">🎯 Budget</a>
      <a href="ai-insights.html">🤖 AI Insights</a>
      <a href="profile.html">👤 Profile</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><strong id="sidebar-user-name">User</strong><span id="sidebar-user-email"></span></div>
      <button class="btn btn-outline btn-sm" style="width:100%" onclick="logout()">🚪 Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button class="btn btn-outline btn-icon" id="sidebar-toggle">☰</button>
      <span class="topbar-title">Income</span>
      <div class="topbar-actions">
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
        <button class="btn btn-success btn-sm" onclick="openModal('income-modal')">+ Add Income</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="grid-3 mb-3">
      <div class="stat-card"><div class="stat-icon green">💵</div><div class="stat-body"><div class="stat-label">Total Income</div><div class="stat-value text-success" id="total-income">—</div></div></div>
      <div class="stat-card"><div class="stat-icon blue">📅</div><div class="stat-body"><div class="stat-label">This Month</div><div class="stat-value" id="month-income">—</div></div></div>
      <div class="stat-card"><div class="stat-icon purple">📊</div><div class="stat-body"><div class="stat-label">Transactions</div><div class="stat-value" id="count-income">—</div></div></div>
    </div>

    <!-- Filter + Table -->
    <div class="card mb-2">
      <div class="filter-bar">
        <div class="search-input">
          <i>🔍</i>
          <input type="text" id="search" class="form-control" placeholder="Search income..." oninput="debounceLoad()"/>
        </div>
        <select id="filter-category" class="form-control" onchange="loadIncome()">
          <option value="">All Categories</option>
          <option>Salary</option><option>Freelance</option><option>Business</option>
          <option>Investment</option><option>Gift</option><option>Others</option>
        </select>
        <input type="date" id="filter-start" class="form-control" onchange="loadIncome()"/>
        <input type="date" id="filter-end"   class="form-control" onchange="loadIncome()"/>
        <button class="btn btn-outline btn-sm" onclick="clearFilters()">✕ Clear</button>
      </div>
    </div>

    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Notes</th><th class="text-right">Amount</th><th>Actions</th></tr></thead>
          <tbody id="income-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="income-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Add Income</h3>
      <button class="modal-close" onclick="closeModal('income-modal')">✕</button>
    </div>
    <form id="income-form">
      <input type="hidden" id="income-id"/>
      <div class="form-row">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="inc-title" class="form-control" placeholder="e.g. Monthly Salary" required/>
        </div>
        <div class="form-group">
          <label>Amount (₹) *</label>
          <input type="number" id="inc-amount" class="form-control" placeholder="0.00" min="0.01" step="0.01" required/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category *</label>
          <select id="inc-category" class="form-control" required>
            <option value="">Select category</option>
            <option>Salary</option><option>Freelance</option><option>Business</option>
            <option>Investment</option><option>Gift</option><option>Others</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date *</label>
          <input type="date" id="inc-date" class="form-control" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <input type="text" id="inc-notes" class="form-control" placeholder="Optional notes"/>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" class="btn btn-outline" onclick="closeModal('income-modal')">Cancel</button>
        <button type="submit" class="btn btn-success" id="save-btn">Save Income</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box" style="max-width:380px">
    <div class="modal-header"><h3>Confirm Delete</h3><button class="modal-close" onclick="closeModal('delete-modal')">✕</button></div>
    <p style="margin-bottom:20px;color:var(--text-muted)">Delete this income record?</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal('delete-modal')">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="assets/js/utils.js"></script>
<script src="assets/js/income.js"></script>
</body>
</html>
