<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ExpenseIQ – Expenses</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">💰 Expense<span>IQ</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">🏠 Dashboard</a>
      <a href="expenses.html">💸 Expenses</a>
      <a href="income.html">💵 Income</a>
      <a href="budget.html">🎯 Budget</a>
      <a href="ai-insights.html">🤖 AI Insights</a>
      <a href="profile.html">👤 Profile</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info"><strong id="sidebar-user-name">User</strong><span id="sidebar-user-email"></span></div>
      <button class="btn btn-outline btn-sm" style="width:100%" onclick="logout()">🚪 Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <button class="btn btn-outline btn-icon" id="sidebar-toggle">☰</button>
      <span class="topbar-title">Expenses</span>
      <div class="topbar-actions">
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
        <button class="btn btn-primary btn-sm" onclick="openModal('expense-modal')">+ Add Expense</button>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="card mb-2">
      <div class="filter-bar">
        <div class="search-input">
          <i>🔍</i>
          <input type="text" id="search" class="form-control" placeholder="Search expenses..." oninput="debounceLoad()"/>
        </div>
        <select id="filter-category" class="form-control" onchange="loadExpenses()">
          <option value="">All Categories</option>
          <option>Food</option><option>Travel</option><option>Shopping</option>
          <option>Bills</option><option>Health</option><option>Entertainment</option>
          <option>Education</option><option>Others</option>
        </select>
        <input type="date" id="filter-start" class="form-control" onchange="loadExpenses()"/>
        <input type="date" id="filter-end"   class="form-control" onchange="loadExpenses()"/>
        <select id="sort-by" class="form-control" onchange="loadExpenses()">
          <option value="date">Sort by Date</option>
          <option value="amount">Sort by Amount</option>
        </select>
        <select id="sort-order" class="form-control" onchange="loadExpenses()">
          <option value="desc">Newest First</option>
          <option value="asc">Oldest First</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="clearFilters()">✕ Clear</button>
      </div>
    </div>

    <!-- Expense Table -->
    <div class="card">
      <div class="flex-between mb-2">
        <strong id="expense-count">Expenses</strong>
        <span id="expense-total" class="text-danger" style="font-weight:700"></span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Title</th><th>Category</th><th>Payment</th><th>Date</th><th>Notes</th><th class="text-right">Amount</th><th>Actions</th></tr></thead>
          <tbody id="expense-tbody"></tbody>
        </table>
      </div>
      <!-- Pagination -->
      <div class="flex-between mt-2" id="pagination" style="display:none!important">
        <button class="btn btn-outline btn-sm" id="prev-btn" onclick="changePage(-1)">← Prev</button>
        <span id="page-info" style="font-size:13px;color:var(--text-muted)"></span>
        <button class="btn btn-outline btn-sm" id="next-btn" onclick="changePage(1)">Next →</button>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="expense-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Add Expense</h3>
      <button class="modal-close" onclick="closeModal('expense-modal')">✕</button>
    </div>
    <form id="expense-form">
      <input type="hidden" id="expense-id"/>
      <div class="form-row">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" id="exp-title" class="form-control" placeholder="e.g. Lunch" required/>
        </div>
        <div class="form-group">
          <label>Amount (₹) *</label>
          <input type="number" id="exp-amount" class="form-control" placeholder="0.00" min="0.01" step="0.01" required/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category *</label>
          <select id="exp-category" class="form-control" required>
            <option value="">Select category</option>
            <option>Food</option><option>Travel</option><option>Shopping</option>
            <option>Bills</option><option>Health</option><option>Entertainment</option>
            <option>Education</option><option>Others</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date *</label>
          <input type="date" id="exp-date" class="form-control" required/>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Payment Method</label>
          <select id="exp-payment" class="form-control">
            <option>Cash</option><option>Card</option><option>UPI</option>
            <option>Net Banking</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <input type="text" id="exp-notes" class="form-control" placeholder="Optional"/>
        </div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" class="btn btn-outline" onclick="closeModal('expense-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-btn">Save Expense</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal-box" style="max-width:380px">
    <div class="modal-header"><h3>Confirm Delete</h3><button class="modal-close" onclick="closeModal('delete-modal')">✕</button></div>
    <p style="margin-bottom:20px;color:var(--text-muted)">Are you sure you want to delete this expense? This cannot be undone.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal('delete-modal')">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="assets/js/utils.js"></script>
<script src="assets/js/expenses.js"></script>
</body>
</html>
